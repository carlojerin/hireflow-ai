<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - HireFlow AI</title>

    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body {
            background: radial-gradient(circle at 20% 20%, #1e2434 0%, #0b0d14 60%);
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 36px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: #4f5bff; box-shadow: 0 0 0 4px rgba(79,91,255,.2); }

        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }

        .form-label { font-size: 12.5px; font-weight: 700; color: #334155; }

        .form-control { border-radius: 10px; padding: 11px 14px; font-size: 14px; border: 1px solid #dbe1ea; }
        .form-control:focus { border-color: #4f5bff; box-shadow: 0 0 0 3px rgba(79,91,255,.12); }

        .btn-admin {
            background: linear-gradient(135deg, #4f5bff, #4f5bff);
            color: #fff; border: 0; border-radius: 10px; padding: 11px; font-weight: 700; font-size: 14px; width: 100%;
        }
        .btn-admin:hover { opacity: .92; color: #fff; }

        .error-box { background: #fef2f2; color: #991b1b; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

        .password-wrapper { position: relative; }
        .password-wrapper .form-control { padding-right: 46px; }
        .password-toggle {
            position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
            border: none; background: transparent; color: #6b7280;
            width: 32px; height: 32px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .password-toggle:hover { background: #f3f4f6; color: #111827; }
        .password-toggle:focus { outline: none; }

        .back-link { color: #64748b; text-decoration: none; font-size: 13px; font-weight: 600; }
        .back-link:hover { color: #0f172a; text-decoration: underline; }

    </style>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="css/theme-glass.css?v=1">
</head>

<body>

    <div class="login-card">

        <div class="brand"><span class="dot"></span> HireFlow Admin</div>
        <div class="subtitle">Platform operator console — admin accounts only</div>

        <div id="loginMessage"></div>

        <form id="adminLoginForm">

            <div class="mb-3">
                <label class="form-label">Email / Username</label>
                <input type="text" class="form-control" id="identifier" required autocomplete="username">
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" title="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-admin" id="loginButton">
                <i class="bi bi-shield-lock me-1"></i> Sign in
            </button>

        </form>

        <div class="text-center mt-3">
            <a href="index.html" class="back-link">
                <i class="bi bi-arrow-left me-1"></i> Back to HireFlow
            </a>
        </div>

    </div>

    <script src="js/admin-login.js?v=1"></script>

</body>

</html>
