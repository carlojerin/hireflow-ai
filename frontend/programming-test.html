<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Programming Assessment - HireFlow AI</title>


    <link
        href="vendor/bootstrap/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="vendor/bootstrap-icons/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/programming-test.css"
    >

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="css/theme-glass.css?v=1">
</head>


<body class="dashboard-body" data-hf="calm">


    <!-- ==================================================
         NAVBAR
         ================================================== -->

    <nav class="navbar navbar-dark jobpilot-navbar">

        <div class="container-fluid px-4">

            <a
                href="index.html"
                class="navbar-brand fw-bold"
            >
                🚀 HireFlow AI
            </a>

            <div class="d-flex align-items-center gap-2">

                <a
                    href="assessment.html" data-dashboard-link
                    class="btn btn-light btn-sm rounded-pill px-3"
                >
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Dashboard
                </a>

            </div>

        </div>

    </nav>


    <!-- ==================================================
         MAIN
         ================================================== -->

    <main class="container-fluid px-4 py-5">

        <div class="programming-page">


            <!-- LOADING -->

            <div id="progLoading" class="text-center">

                <div
                    class="spinner-border text-primary"
                    role="status"
                ></div>

                <div class="fw-semibold mt-3" id="progLoadingText">
                    Loading your programming assessment...
                </div>

            </div>


            <!-- MESSAGE (errors / not eligible) -->

            <div id="progMessage"></div>


            <!-- HEADER -->

            <div
                id="progHeaderCard"
                class="programming-header-card"
                style="display:none;"
            >

                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">

                    <div>
                        <div class="small text-uppercase text-muted fw-bold">
                            Programming Assessment
                        </div>
                        <h3 class="fw-bold mb-0" id="progJobTitle">
                            Job Title
                        </h3>
                        <div class="text-muted" id="progCompanyName"></div>
                    </div>

                    <div class="text-end">
                        <div class="small text-uppercase text-muted fw-bold">
                            Time Remaining
                        </div>
                        <div class="programming-timer" id="progTimer">
                            45:00
                        </div>
                    </div>

                </div>

            </div>


            <!-- QUESTION NAVIGATION -->

            <div
                id="progNav"
                class="programming-nav"
                style="display:none;"
            ></div>


            <!-- QUESTIONS -->

            <div id="progQuestionsContainer" style="display:none;"></div>


            <!-- FINAL SUBMIT -->

            <div
                id="progFinalSubmitCard"
                class="programming-card text-center"
                style="display:none;"
            >

                <button
                    type="button"
                    id="progSubmitFinalButton"
                    class="btn btn-primary rounded-pill px-4"
                >
                    <i class="bi bi-send-check me-1"></i>
                    Submit Final Assessment
                </button>

                <div class="small text-muted mt-2">
                    This is final — once submitted, your programming
                    assessment cannot be changed or retaken.
                </div>

            </div>


            <!-- RESULT -->

            <div
                id="progResultSection"
                class="programming-card text-center"
                style="display:none;"
            >

                <div class="programming-result-icon" id="progResultIcon">
                    <i class="bi bi-code-slash"></i>
                </div>

                <h3 class="fw-bold mb-1">Programming Assessment Complete</h3>

                <div id="progResultBadge" class="mb-3"></div>

                <div id="progQuestionResults" class="text-start mx-auto" style="max-width:520px;"></div>

                <a
                    href="assessment.html" data-dashboard-link
                    class="btn btn-outline-primary rounded-pill px-4 mt-4"
                >
                    Back to Dashboard
                </a>

            </div>

        </div>

    </main>


    <script
        src="vendor/bootstrap/bootstrap.bundle.min.js"
    ></script>

    <script src="./js/session-guard.js?v=3"></script>
<script src="./js/csrf-fetch.js?v=1"></script>
    <script src="./js/camera-quality.js?v=1"></script>
    <script src="./js/face-proctor.js?v=4"></script>
    <script src="./js/exam-lock.js?v=3"></script>
    <script src="./js/integrity-guards.js?v=3"></script>
    <script src="./js/audio-proctor.js?v=1"></script>
    <script src="./js/screen-proctor.js?v=2"></script>
    <script src="./js/assessment-integrity.js?v=104"></script>
    <script src="./js/assessment-video-recorder.js?v=4"></script>
    <script src="./js/phone-detector.js?v=7"></script>
    <script src="./js/programming-test.js?v=5"></script>


    <script src="./js/dashboard-link.js"></script>
</body>

</html>
